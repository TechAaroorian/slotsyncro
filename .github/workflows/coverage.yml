name: Test Coverage & PR Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write # Required to post comments on Pull Requests
  contents: read

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @repo/db db:generate

      - name: Run Vitest Coverage
        run: pnpm --filter app test:coverage

      # 1. Post In-PR Coverage Summary Table (PRs only)
      - name: Post PR Coverage Comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request' && always()
        with:
          json-summary-path: ./apps/app/coverage/coverage-summary.json
          json-final-path: ./apps/app/coverage/coverage-final.json

      # 2. Save Interactive HTML Report as Workflow Artifact (Downloadable on every run)
      - name: Upload HTML Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-html-coverage-report
          path: apps/app/coverage/
          retention-days: 14
