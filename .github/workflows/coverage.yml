name: Test Coverage & PR Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 1. Grant permissions required for GitHub Pages & PR comments
permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

# 2. Ensure only one Pages deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy_db"
        run: pnpm --filter @repo/db db:generate

      - name: Run Vitest Coverage
        run: pnpm --filter app test:coverage

      # Post summary comment on Pull Requests
      - name: Post PR Coverage Comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request' && always()
        with:
          json-summary-path: ./apps/app/coverage/coverage-summary.json
          json-final-path: ./apps/app/coverage/coverage-final.json

      # Upload ZIP artifact to Actions tab (Backup access)
      - name: Upload HTML Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-html-coverage-report
          path: apps/app/coverage/
          retention-days: 14

      # --- GitHub Pages Deployment Steps (Only runs on push to main) ---
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/coverage/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4
